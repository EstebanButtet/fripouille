[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-ia"
version = "0.1.0"
description = "Local, modular and secure personal AI assistant."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]